[character]
success_symbol = "[\\$](bold green)"
error_symbol = "[\\$](bold red)"

[directory]
fish_style_pwd_dir_length = 2

[git_status]
disabled = true

[package]
disabled = true

[rust]
disabled = true

[python]
disabled = true

[java]
disabled = true

[docker_context]
disabled = true

[time]
format = "[$time]($style)"
disabled = false

[aws]
disabled = true

[gcloud]
disabled = true

# Show jj status when available, otherwise render the Git modules once.
[custom.vcs]
description = "current version control status"
shell = ["sh"]
when = "true"
unsafe_no_escape = true
format = "$output"
command = '''
if output=$(jj log --revisions @ --no-graph --ignore-working-copy --color always --limit 1 --template '
  separate(" ",
    change_id.shortest(4),
    bookmarks,
    "|",
    concat(
      if(conflict, "💥"),
      if(divergent, "🚧"),
      if(hidden, "👻"),
      if(immutable, "🔒"),
    ),
    raw_escape_sequence("\x1b[1;32m") ++ if(empty, "(empty)"),
    raw_escape_sequence("\x1b[1;32m") ++ coalesce(
      truncate_end(29, description.first_line(), "…"),
      "(no description set)",
    ) ++ raw_escape_sequence("\x1b[0m"),
  )
' 2>/dev/null); then
  printf '\033[1;32m🥋 %s \033[0m' "$output"
else
  output=$(STARSHIP_CONFIG="$HOME/dotfiles/config/starship-git.toml" starship prompt)
  if [ -n "$output" ]; then
    printf '%s\033[0m' "$output"
  fi
fi
'''

# disable git modules
[git_state]
disabled = true

[git_commit]
disabled = true

[git_metrics]
disabled = true

[git_branch]
disabled = true

