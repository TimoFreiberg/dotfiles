version: 1
workers:
  glm_flash:
    model: "glm-5.3-flash(high)"
  codex_luna:
    model: "gpt-5.6-luna(xhigh)"
  deepseek:
    model: "deepseek-v4-flash(high)"
  astra_low:
    model: "gpt-6-astra(low)"
  astra_medium:
    model: "gpt-6-astra(medium)"
levels:
  routine:
    strategy: ordered-fallback
    workers: [glm_flash, astra_low, deepseek]
  thorough:
    strategy: parallel
    workers: [glm_flash, astra_medium, deepseek]
  critical:
    strategy: parallel
    workers: [glm_flash, astra_medium, deepseek]
