version: 1
workers:
  glm_flash:
    model: "zai/glm-5.3-flash(high)"
  codex_luna:
    model: "codex/gpt-5.6-luna(xhigh)"
  deepseek:
    model: "deepseek/deepseek-v4-flash(high)"
  codex_sol:
    model: "codex/gpt-5.6-sol(medium)"
levels:
  routine:
    strategy: ordered-fallback
    workers: [glm_flash, codex_luna, deepseek]
  thorough:
    strategy: parallel
    workers: [glm_flash, codex_luna, deepseek]
  critical:
    strategy: parallel
    workers: [glm_flash, codex_sol, deepseek]
